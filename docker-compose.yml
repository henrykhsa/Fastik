services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastik-app
    restart: always
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/fastik?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-24h}
      WEBHOOK_API_KEY: ${WEBHOOK_API_KEY}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN}
      CLOCK_DRIFT_TOLERANCE_MINUTES: ${CLOCK_DRIFT_TOLERANCE_MINUTES:-3}
      WATCHDOG_TIMEOUT_HOURS: ${WATCHDOG_TIMEOUT_HOURS:-4}
      BATCHING_WINDOW_SECONDS: ${BATCHING_WINDOW_SECONDS:-120}
      ORDER_ACCEPT_TIMEOUT_MINUTES: ${ORDER_ACCEPT_TIMEOUT_MINUTES:-5}
      PORT: 3000
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: fastik-db
    restart: always
    environment:
      POSTGRES_DB: fastik
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fastik-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
