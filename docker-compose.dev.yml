# Fastik LOCAL DEV — portas escolhidas para NÃO colidir com o ambiente de dev
# do Laurus (que já usa Postgres na 5432 e o next dev na 3000).
#
#   app      → localhost:3333   (Laurus dev aponta FASTIK_API_URL aqui)
#   postgres → localhost:5433   (evita o 5432 do laurus_db_local)
#   redis    → localhost:6380   (evita 6379 caso algo use)
#
# Subir:  docker compose -f docker-compose.dev.yml up -d --build
# Parar:  docker compose -f docker-compose.dev.yml down

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastik-app-dev
    restart: unless-stopped
    ports:
      - '3333:3000'
    environment:
      DATABASE_URL: postgresql://postgres:fastik_dev_pass@postgres:5432/fastik?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: dev-jwt-secret
      JWT_EXPIRATION: 24h
      WEBHOOK_API_KEY: dev-webhook-key
      # Token de bootstrap para o Laurus DEV apontar — copie este mesmo valor
      # no FASTIK_BOOTSTRAP_TOKEN do .env do Hotel-saas.
      BOOTSTRAP_TOKEN: dev-bootstrap-token
      CLOCK_DRIFT_TOLERANCE_MINUTES: 3
      WATCHDOG_TIMEOUT_HOURS: 4
      BATCHING_WINDOW_SECONDS: 120
      ORDER_ACCEPT_TIMEOUT_MINUTES: 5
      PORT: 3000
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: fastik-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: fastik
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: fastik_dev_pass
    ports:
      - '5433:5432'
    volumes:
      - fastik_dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fastik-redis-dev
    restart: unless-stopped
    ports:
      - '6380:6379'
    volumes:
      - fastik_dev_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  fastik_dev_pgdata:
  fastik_dev_redis:
